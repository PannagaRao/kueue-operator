# lws.yaml (replace your leader/worker containers)
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: nginx-lws
  namespace: kueue-managed
  labels:
    kueue.x-k8s.io/queue-name: gpu-local-queue
spec:
  replicas: 2
  leaderWorkerTemplate:
    size: 3
    leaderTemplate:
      spec:
        containers:
        - name: leader
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
    workerTemplate:
      spec:
        containers:
        - name: worker
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
          - containerPort: 8080
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"